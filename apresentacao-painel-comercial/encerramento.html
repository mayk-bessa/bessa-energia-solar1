<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Propostas consistentes. Decisões rápidas.</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    .slide-container { width: 1280px; min-height: 720px; background: #f4f4f4; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; display: flex; }
    .main-field { width: 830px; min-height: 720px; background: #253c7e; color: #ffffff; padding: 92px 78px 0; display: flex; flex-direction: column; justify-content: space-between; }
    .eyebrow { color: #ff6900; font-size: 16px; font-weight: 900; letter-spacing: 2.8px; text-transform: uppercase; }
    h1 { margin-top: 34px; max-width: 620px; font-size: 72px; line-height: .93; letter-spacing: -3.2px; font-weight: 900; }
    .rule { width: 246px; height: 2px; background: #ff6900; margin-top: 38px; }
    .brand { border-top: 2px solid rgba(255,255,255,.36); padding-top: 25px; padding-bottom: 56px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 800; letter-spacing: .5px; }
    .brand small { color: #dbe4ff; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .side-field { width: 450px; min-height: 720px; position: relative; overflow: hidden; }
    .vertical-line { position: absolute; left: 72px; top: 0; width: 2px; min-height: 720px; background: #253c7e; }
    .orange-square { position: absolute; right: 0; bottom: 0; width: 302px; min-height: 302px; background: #ff6900; }
    .outline-circle { position: absolute; top: 112px; right: 72px; width: 188px; height: 188px; border: 2px solid #253c7e; border-radius: 50%; }
    .page { position: absolute; right: 55px; top: 56px; color: #253c7e; font-size: 15px; font-weight: 900; letter-spacing: 2px; }
    .closing { position: absolute; left: 112px; bottom: 79px; width: 235px; color: #253c7e; font-size: 20px; line-height: 1.2; font-weight: 900; letter-spacing: -.5px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="main-field">
      <div>
        <div class="eyebrow">Painel Comercial Bessa Energia</div>
        <h1>Propostas consistentes.<br />Decisões rápidas.</h1>
        <div class="rule"></div>
      </div>
      <div class="brand"><span>BESSA ENERGIA SOLAR</span><small>Treinamento operacional</small></div>
    </section>
    <section class="side-field" aria-hidden="true">
      <div class="vertical-line"></div>
      <div class="outline-circle"></div>
      <div class="orange-square"></div>
      <div class="page">12 / 12</div>
      <div class="closing">Obrigado pela atenção.</div>
    </section>
  </div>
</body>
</html>
