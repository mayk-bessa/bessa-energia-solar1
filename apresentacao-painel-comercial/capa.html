<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel Comercial Bessa Energia</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    .slide-container { width: 1280px; min-height: 720px; background: #f4f4f4; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; display: flex; }
    .blue-field { width: 780px; min-height: 720px; background: #253c7e; color: #ffffff; padding: 86px 78px 0; display: flex; flex-direction: column; justify-content: space-between; }
    .eyebrow { color: #ff6900; font-size: 18px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
    h1 { font-size: 72px; line-height: .95; letter-spacing: -3px; font-weight: 900; max-width: 590px; margin-top: 28px; }
    .subtitle { border-left: 2px solid #ff6900; margin-top: 36px; padding-left: 20px; font-size: 25px; line-height: 1.35; max-width: 520px; color: #e9eeff; }
    .brand { border-top: 2px solid rgba(255,255,255,.38); padding-top: 24px; padding-bottom: 54px; font-size: 18px; font-weight: 700; letter-spacing: .6px; }
    .right-field { position: relative; width: 500px; min-height: 720px; overflow: hidden; }
    .line { position: absolute; left: 90px; top: 0; width: 2px; min-height: 720px; background: #253c7e; }
    .orange-block { position: absolute; right: 0; bottom: 0; width: 340px; min-height: 320px; background: #ff6900; }
    .circle { position: absolute; right: 82px; top: 92px; width: 210px; height: 210px; border-radius: 50%; border: 2px solid #253c7e; }
    .index { position: absolute; right: 65px; top: 56px; font-size: 17px; font-weight: 800; letter-spacing: 2px; color: #253c7e; }
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="blue-field">
      <div>
        <div class="eyebrow">Treinamento operacional</div>
        <h1>Painel<br />Comercial<br />Bessa Energia</h1>
        <p class="subtitle">Guia prático para vendedores e administradores</p>
      </div>
      <div class="brand">BESSA ENERGIA SOLAR</div>
    </section>
    <section class="right-field" aria-hidden="true">
      <div class="line"></div>
      <div class="circle"></div>
      <div class="orange-block"></div>
      <div class="index">01 / 12</div>
    </section>
  </div>
</body>
</html>
